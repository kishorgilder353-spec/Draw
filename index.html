<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>画室</title>
<style>
:root{--bg:#e6e9ed;--pn:#f5f6f8;--ln:#d3d8df;--ink:#1b2330;--mu:#6a7483;--ac:#0e6b73;--ac2:#0a5258;--paper:#fdfdfc}
*{box-sizing:border-box;margin:0}[hidden]{display:none!important}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font:14px/1.55 -apple-system,"Inter","PingFang SC","Noto Sans SC","Microsoft YaHei",sans-serif;display:grid;grid-template-rows:auto 1fr;overflow:hidden}
button,input{font:inherit;color:inherit}
button{cursor:pointer;border:1px solid var(--ln);background:var(--pn);border-radius:6px;padding:6px 12px}
button:hover{border-color:#aab2be}button:disabled{opacity:.6;cursor:wait}
button.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.pri{background:var(--ac)!important;color:#fff;border-color:var(--ac)!important}.pri:hover{background:var(--ac2)!important}
:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
input[type=text],input:not([type]){border:1px solid var(--ln);border-radius:6px;padding:9px 11px;background:#fff;width:100%}
header{display:flex;align-items:center;gap:12px;padding:10px 18px;background:var(--pn);border-bottom:1px solid var(--ln)}
.brand{font:600 19px "Noto Serif SC","Songti SC",serif;letter-spacing:.08em}
.sp{flex:1}
.seg{display:flex}.seg button{border-radius:0;padding:5px 10px}.seg button:first-child{border-radius:6px 0 0 6px}.seg button:last-child{border-radius:0 6px 6px 0}.seg button+button{border-left:0}
main{overflow:auto;min-height:0}
.pg{display:none;max-width:1000px;margin:0 auto;padding:36px 20px}.pg.on{display:block}
h1{font:600 28px/1.3 "Noto Serif SC","Songti SC",serif;margin-bottom:8px}
.sub{color:var(--mu);margin-bottom:22px;max-width:56ch}
.card{background:var(--pn);border:1px solid var(--ln);border-radius:10px;padding:18px 20px}
.f{display:flex;flex-direction:column;gap:10px}
.er{color:#b03a2e;min-height:20px;font-size:13px}
#p-reg .card{max-width:420px}
.modes{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.mc{text-align:left;padding:22px;border-radius:10px;background:var(--pn);display:flex;flex-direction:column;gap:6px;transition:border-color .15s,transform .15s}
.mc:hover{border-color:var(--ac);transform:translateY(-2px)}
.mc i{font:600 64px/1 "Noto Serif SC","Songti SC",serif;color:var(--ac);font-style:normal;margin-bottom:10px}
.mc b{font-size:18px}.mc span{color:var(--mu)}
.top{display:flex;align-items:center;gap:12px;margin-bottom:18px}
.tag{border:1px solid var(--ac);color:var(--ac);border-radius:20px;padding:1px 12px;font-size:13px}
.lob{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
.lob h3{font-size:16px;margin-bottom:4px}.lob p{color:var(--mu);font-size:13px;margin-bottom:12px}
.res{margin-top:12px;padding:10px 12px;background:#fff;border:1px dashed var(--ln);border-radius:6px;display:flex;flex-direction:column;gap:8px}
.res b{font-size:20px;letter-spacing:.14em}
.res div{display:flex;justify-content:space-between;align-items:center;gap:8px}
#p-room.on{display:grid;grid-template-columns:1fr 310px;gap:14px;max-width:none;height:100%;padding:14px}
.stage{display:flex;flex-direction:column;gap:10px;min-height:0;min-width:0}
#bar{display:flex;align-items:center;gap:12px;min-height:36px}
#msg{flex:1;font-size:15px}#msg em{font-style:normal;font-weight:600;letter-spacing:.15em}
#tm{font-variant-numeric:tabular-nums;color:var(--mu)}
.cw{flex:1;min-height:0;display:flex;align-items:center;justify-content:center}
#cv{background:var(--paper);border:1px solid var(--ln);border-radius:4px;box-shadow:0 1px 2px rgba(20,30,45,.08),0 8px 24px rgba(20,30,45,.07);touch-action:none;max-width:100%;max-height:100%;aspect-ratio:16/10;cursor:crosshair}
#cv.lock{cursor:not-allowed;opacity:.9}
.tb{display:flex;align-items:center;gap:10px;flex-wrap:wrap;background:var(--pn);border:1px solid var(--ln);border-radius:8px;padding:8px 10px}
.sw{display:flex;gap:5px;flex-wrap:wrap;max-width:230px}
.sw button{width:22px;height:22px;padding:0;border-radius:50%;border:1px solid rgba(0,0,0,.18)}
.sw button.on{outline:2px solid var(--ink);outline-offset:2px}
#cp{width:34px;height:30px;padding:0;border:1px solid var(--ln);border-radius:6px;background:none}
#sz{width:100px;accent-color:var(--ac)}
aside{display:flex;flex-direction:column;gap:12px;min-height:0}
.box{padding:10px 12px;background:var(--pn);border:1px solid var(--ln);border-radius:8px}
.box h3{font-size:13px;font-weight:600;color:var(--mu);margin-bottom:6px}
.p{display:flex;gap:8px}.p span{flex:1}.p small{color:var(--mu)}
.chat{flex:1;min-height:0;display:flex;flex-direction:column}
#log{flex:1;overflow:auto;display:flex;flex-direction:column;gap:5px;padding-bottom:6px;word-break:break-word}
#log .sy{color:var(--mu);font-size:13px}
.chat #cf{display:flex;gap:6px}
.rinfo{display:flex;align-items:center;gap:10px;color:var(--mu);font-size:13px}
#log .ok{color:var(--ac);font-weight:600}
.st{color:var(--mu);font-size:13px;display:flex;align-items:center;gap:6px}
.st:before{content:"";width:8px;height:8px;border-radius:50%;background:#c0392b}.st.ok:before{background:#2e9e6a}
#tt{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:9px 16px;border-radius:8px;z-index:9;max-width:90vw}
@media(max-width:820px){
 body{overflow:auto;display:block}main{overflow:visible}
 .modes,.lob{grid-template-columns:1fr}
 #p-room.on{display:flex;flex-direction:column;height:auto}
 .cw{flex:none}#cv{width:100%}aside{height:60vh}
 h1{font-size:23px}
}
</style>
</head>
<body>
<header>
 <div class="brand" data-i="brand"></div><div class="sp"></div>
 <span id="st" class="st"></span><button id="who" hidden></button>
 <div class="seg" id="lg"><button data-l="0">中文</button><button data-l="1">EN</button><button data-l="2">ID</button></div>
</header>
<main>
 <section class="pg" id="p-reg">
  <h1 data-i="regT"></h1><p class="sub" data-i="regH"></p>
  <div class="card f" id="rf"><input id="rn" maxlength="12" data-p="regP" autocomplete="off"><div class="er" id="re"></div><button class="pri" id="rbtn" data-i="regB"></button></div>
 </section>

 <section class="pg" id="p-mode">
  <h1 data-i="modeT"></h1><p class="sub" data-i="modeH"></p>
  <div class="modes">
   <button class="mc" data-m="free"><i>画</i><b data-i="mFree"></b><span data-i="mFreeD"></span></button>
   <button class="mc" data-m="game"><i>猜</i><b data-i="mGame"></b><span data-i="mGameD"></span></button>
  </div>
 </section>

 <section class="pg" id="p-lobby">
  <div class="top"><button id="bk" data-i="back"></button><span class="tag" id="lm"></span></div>
  <h1 data-i="lobT"></h1><p class="sub" data-i="lobH"></p>
  <div class="lob">
   <div class="card f"><h3 data-i="join"></h3><p data-i="joinD"></p>
    <input id="jc" maxlength="8" data-p="code" autocomplete="off"><input id="jp" maxlength="8" data-p="pass" autocomplete="off">
    <div class="er" id="je"></div><button class="pri" id="jb" data-i="joinB"></button></div>
   <div class="card f"><h3 data-i="create"></h3><p data-i="createD"></p>
    <button class="pri" id="cb" data-i="createB"></button>
    <div class="res" id="cres" hidden>
     <div><span data-i="code"></span><b id="cc"></b></div><div><span data-i="pass"></span><b id="cpw"></b></div>
     <div><button id="cy" data-i="copy"></button><button class="pri" id="ce" data-i="enterB"></button></div></div></div>
   <div class="card f"><h3 data-i="rand"></h3><p data-i="randD"></p><button class="pri" id="rb" data-i="randB"></button></div>
  </div>
 </section>

 <section class="pg" id="p-room">
  <div class="stage">
   <div class="rinfo"><button id="lv" data-i="leave"></button><span class="tag" id="rmode"></span><span><span data-i="code"></span> <b id="rc"></b></span><span><span data-i="pass"></span> <b id="rpw"></b></span><button id="rcopy" data-i="copy"></button></div>
   <div id="bar"><div id="msg"></div><div id="tm"></div><button class="pri" id="go" hidden></button></div>
   <div class="cw"><canvas id="cv"></canvas></div>
   <div class="tb">
    <div class="sw" id="sw"></div><input type="color" id="cp" value="#1b2330">
    <input type="range" id="sz" min="2" max="48" value="6">
    <div class="seg"><button id="bp" class="on" data-i="pen"></button><button id="be" data-i="eraser"></button></div>
    <button id="un" data-i="undo"></button><button id="cr" data-i="clear"></button><button id="sv" data-i="save"></button>
   </div>
  </div>
  <aside>
   <div class="box"><h3 data-i="players"></h3><div id="pl"></div></div>
   <div class="box chat"><h3 id="ch"></h3><div id="log"></div>
    <div id="cf"><input id="ci" maxlength="80" data-p="chatP" autocomplete="off"><button class="pri" id="sbtn" data-i="send"></button></div></div>
  </aside>
 </section>
</main>

<div id="tt" hidden></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.102.0/dist/umd/supabase.js"></script>
<script>
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];
const MEM={};
const LS=(k,v)=>{try{if(v===undefined)return JSON.parse(localStorage.getItem(k)||'null');localStorage.setItem(k,JSON.stringify(v))}catch(e){if(v===undefined)return MEM[k]===undefined?null:MEM[k];MEM[k]=v}};
/* ---- i18n: [中文, English, Indonesia] ---- */
const D={
brand:['画室','Atelier','Ruang Gambar'],
regT:['创建你的虚拟名字','Create your alias','Buat nama samaran'],
regH:['进入前先注册一个虚拟名字。全站唯一，不可重复，不需要真实信息。','Pick an alias before you enter. It is unique across the site and no real details are needed.','Pilih nama samaran sebelum masuk. Nama harus unik dan tidak perlu data asli.'],
regP:['虚拟名字（2–12 个字符）','Alias (2–12 characters)','Nama samaran (2–12 karakter)'],
regB:['注册并继续','Register and continue','Daftar dan lanjut'],
errLen:['名字需要 2–12 个字符','Use 2–12 characters','Gunakan 2–12 karakter'],
errTaken:['这个名字已被占用，请换一个','That alias is already taken','Nama ini sudah dipakai'],
rename:['更换名字','Change alias','Ganti nama'],
modeT:['选择玩法','Choose a mode','Pilih mode'],
modeH:['两种玩法都支持多人实时同步。','Both modes sync live between players.','Kedua mode tersinkron langsung antar pemain.'],
mFree:['共同画画','Co-draw','Gambar Bersama'],
mFreeD:['和房间里的人在同一张画布上同时创作。','Draw together on one shared canvas.','Menggambar bersama di satu kanvas.'],
mGame:['你画我猜','Draw & Guess','Tebak Gambar'],
mGameD:['轮流作画，其他人在聊天里猜词，猜对得分。','Take turns drawing while others guess the word in chat.','Gambar bergiliran, yang lain menebak kata di obrolan.'],
back:['返回','Back','Kembali'],
lobT:['进入房间','Enter a room','Masuk ruangan'],
lobH:['加入朋友的房间，自己创建一个，或者随机匹配。','Join a friend, create your own, or get matched.','Gabung ke teman, buat sendiri, atau cari acak.'],
join:['加入房间','Join a room','Gabung ruangan'],
joinD:['输入房间号和房间密码。','Enter the room code and password.','Masukkan kode dan kata sandi.'],
code:['房间号','Room code','Kode ruangan'],
pass:['密码','Password','Kata sandi'],
joinB:['加入','Join','Gabung'],
errRoom:['房间不存在或密码错误','Room not found or wrong password','Ruangan tidak ada atau sandi salah'],
create:['创建房间','Create a room','Buat ruangan'],
createD:['自动生成房间号和随机密码，发给朋友即可。','A room code and random password are generated for you to share.','Kode ruangan dan sandi acak dibuat untuk dibagikan.'],
createB:['创建','Create','Buat'],
copy:['复制','Copy','Salin'],copied:['已复制','Copied','Tersalin'],
enterB:['进入房间','Enter room','Masuk'],
rand:['随机匹配','Quick match','Pencarian acak'],
randD:['和正在等待的玩家随机组队。','Get paired with players who are waiting.','Dipasangkan dengan pemain yang menunggu.'],
randB:['开始匹配','Find a match','Cari pemain'],matching:['匹配中…','Matching…','Mencari…'],
leave:['离开','Leave','Keluar'],
players:['房间成员','Players','Pemain'],
chatT:['聊天','Chat','Obrolan'],guessT:['猜词','Guess','Tebak'],
chatP:['输入消息','Type a message','Tulis pesan'],send:['发送','Send','Kirim'],
pen:['画笔','Pen','Pena'],eraser:['橡皮','Eraser','Penghapus'],undo:['撤销','Undo','Urungkan'],clear:['清空','Clear','Hapus'],save:['保存图片','Save image','Simpan gambar'],
freeMsg:['所有人可以同时在画布上作画。','Everyone can draw on the canvas at the same time.','Semua orang bisa menggambar bersamaan.'],
idle:['点击开始，玩家轮流作画。','Press start; players take turns drawing.','Tekan mulai; pemain menggambar bergiliran.'],
start:['开始游戏','Start game','Mulai'],skip:['下一轮','Next round','Ronde berikutnya'],
yours:['轮到你画：','Your turn to draw: ','Giliranmu: '],
over:['时间到，答案是：','Time is up. The word was: ','Waktu habis. Katanya: '],
demo:['静态预览：尚未连接服务器，内容只在本机可见。','Static preview: no server yet, everything stays on this device.','Pratinjau statis: belum ada server, semua hanya di perangkat ini.'],
me:['我','me','saya'],
errFull:['房间已满','The room is full','Ruangan penuh'],
errMany:['尝试次数过多，请 10 分钟后再试','Too many attempts. Try again in 10 minutes.','Terlalu banyak percobaan. Coba lagi 10 menit lagi.'],
errGen:['操作失败，请重试','Something went wrong. Please try again.','Terjadi kesalahan. Coba lagi.'],
errNet:['连接服务器失败，请检查网络后刷新页面','Could not reach the server. Check your connection and refresh.','Tidak bisa terhubung ke server. Periksa koneksi lalu muat ulang.'],
conn:['连接中','Connecting','Menghubungkan'],live:['已连接','Connected','Terhubung'],off:['已断开','Disconnected','Terputus'],
joined:['加入了房间','joined the room','bergabung'],left:['离开了房间','left the room','keluar'],
drawerIs:['正在作画','is drawing','sedang menggambar'],hit:['猜对了','got it right','menebak dengan benar'],
need2:['至少需要 2 位玩家','At least 2 players are needed','Dibutuhkan minimal 2 pemain'],
wait:['准备下一轮…','Next round starting…','Ronde berikutnya…'],
W:['苹果,飞机,自行车,长城,火锅,熊猫,雨伞,月亮,吉他,恐龙,彩虹,灯塔','apple,airplane,bicycle,great wall,hot pot,panda,umbrella,moon,guitar,dinosaur,rainbow,lighthouse','apel,pesawat,sepeda,tembok besar,panci,panda,payung,bulan,gitar,dinosaurus,pelangi,mercusuar']
};
const LG=['zh','en','id'];let li=Math.max(0,LG.indexOf(LS('lang')));
const t=k=>D[k][li];
function applyLang(){
 document.documentElement.lang=LG[li];LS('lang',LG[li]);
 $$('[data-i]').forEach(e=>e.textContent=t(e.dataset.i));$$('[data-p]').forEach(e=>e.placeholder=t(e.dataset.p));
 $$('#lg button').forEach(b=>b.classList.toggle('on',+b.dataset.l==li));
 $('#who').textContent=(me||'')+' ✎';$('#who').title=t('rename');
 $('#lm').textContent=mode?t(mode=='free'?'mFree':'mGame'):'';$('#rmode').textContent=$('#lm').textContent;
 $('#ch').textContent=t(mode=='game'?'guessT':'chatT');rui();rpl();
}
$('#lg').onclick=e=>{if(e.target.dataset.l!=null){li=+e.target.dataset.l;applyLang()}};

/* ---- supabase ---- */
const SB_URL='https://lmtfnwfqginwofmwnpbh.supabase.co',SB_KEY='sb_publishable_4V-TpxsWv6Mf_RKThlp_Lg_2jyQagx4';
const sb=supabase.createClient(SB_URL,SB_KEY,{realtime:{params:{eventsPerSecond:60}}});
let me=null,uid=null,mode=null,page='',cur=null,room=null,ch=null,hb=0,t0=0;
const setSt=k=>{const e=$('#st');e.dataset.i=k;e.textContent=t(k);e.className='st'+(k=='live'?' ok':'')};
const toast=k=>{const e=$('#tt');e.dataset.i=k;e.textContent=t(k);e.hidden=false;clearTimeout(toast.h);toast.h=setTimeout(()=>e.hidden=true,3500)};
function go(p){page=p;$$('.pg').forEach(e=>e.classList.toggle('on',e.id=='p-'+p));$('#who').hidden=!me;$('main').scrollTop=0;applyLang()}
const err=(id,k)=>{const e=$('#'+id);if(k){e.dataset.i=k;e.textContent=t(k)}else{delete e.dataset.i;e.textContent=''}};
const ERR={alias_taken:'errTaken',bad_length:'errLen',bad_room:'errRoom',room_full:'errFull',too_many:'errMany'};
async function rpc(fn,a){try{const{data,error}=await sb.rpc(fn,a);if(error)throw error;return data||{ok:false,error:'net'}}catch(e){console.error(fn,e);return{ok:false,error:'net'}}}
const busy=async(b,f)=>{b.disabled=true;try{await f()}finally{b.disabled=false}};
const cp=async(b,x)=>{try{await navigator.clipboard.writeText(x)}catch{}b.textContent=t('copied');setTimeout(()=>b.textContent=t('copy'),1400)};

/* ---- register / mode / lobby ---- */
const doReg=()=>busy($('#rbtn'),async()=>{const r=await rpc('set_alias',{p_alias:$('#rn').value});
 if(!r.ok)return err('re',ERR[r.error]||'errGen');me=r.alias;err('re');go('mode')});
$('#rbtn').onclick=doReg;
$('#rn').onkeydown=e=>{if(e.key=='Enter'&&!e.isComposing)doReg()};
$('#who').onclick=()=>{$('#rn').value=me||'';err('re');go('reg')};
$$('.mc').forEach(b=>b.onclick=()=>{mode=b.dataset.m;$('#cres').hidden=true;err('je');go('lobby')});
$('#bk').onclick=()=>go('mode');
$('#cb').onclick=()=>busy($('#cb'),async()=>{const r=await rpc('create_room',{p_mode:mode,p_private:true});
 if(!r.ok)return toast(ERR[r.error]||'errGen');cur=r;$('#cc').textContent=r.code;$('#cpw').textContent=r.password;$('#cres').hidden=false});
$('#cy').onclick=()=>cp($('#cy'),cur.code+' / '+cur.password);
$('#rcopy').onclick=()=>cp($('#rcopy'),$('#rc').textContent+' / '+$('#rpw').textContent);
$('#ce').onclick=()=>enter(cur.code,cur.password);
$('#jb').onclick=()=>busy($('#jb'),async()=>{const p=$('#jp').value.trim(),r=await rpc('join_room',{p_code:$('#jc').value,p_pass:p});
 if(!r.ok)return err('je',ERR[r.error]||'errGen');err('je');mode=r.mode;enter(r.code,p)});
$('#rb').onclick=()=>busy($('#rb'),async()=>{$('#rb').textContent=t('matching');const r=await rpc('quick_match',{p_mode:mode});
 $('#rb').textContent=t('randB');if(!r.ok)return toast(ERR[r.error]||'errGen');enter(r.code,null)});

/* ---- canvas ---- */
const S=new Map(),order=[],mine=[];
let color='#1b2330',size=6,erase=false,game,scores={},secret='',players=[],synced=false;
const newGame=()=>({ph:'idle',drawer:null,len:0,end:0,hits:[],round:0});game=newGame();
const cv=$('#cv'),ctx=cv.getContext('2d');cv.width=1600;cv.height=1000;
const paper=()=>{ctx.fillStyle='#fdfdfc';ctx.fillRect(0,0,1600,1000)};paper();
function seg(s,from){ctx.strokeStyle=ctx.fillStyle=s.e?'#fdfdfc':s.c;ctx.lineWidth=s.w;ctx.lineCap=ctx.lineJoin='round';const p=s.p;
 if(p.length==1){ctx.beginPath();ctx.arc(p[0][0]*1600,p[0][1]*1000,s.w/2,0,7);ctx.fill();return}
 const a=Math.max(from-1,0);ctx.beginPath();ctx.moveTo(p[a][0]*1600,p[a][1]*1000);for(let i=a+1;i<p.length;i++)ctx.lineTo(p[i][0]*1600,p[i][1]*1000);ctx.stroke()}
const redraw=()=>{paper();order.forEach(i=>seg(S.get(i),0))};
const rmS=i=>{S.delete(i);let k=order.indexOf(i);if(k>-1)order.splice(k,1);k=mine.indexOf(i);if(k>-1)mine.splice(k,1)};
const wipe=()=>{S.clear();order.length=0;mine.length=0;paper()};
const send=(ev,p={})=>ch&&ch.send({type:'broadcast',event:ev,payload:p});
const canDraw=()=>mode=='free'||(game.ph=='draw'&&game.drawer==uid);
const pos=e=>{const r=cv.getBoundingClientRect();return[+((e.clientX-r.left)/r.width).toFixed(4),+((e.clientY-r.top)/r.height).toFixed(4)]};
let cs=null,buf=[],raf=0;
const flush=()=>{raf=0;if(!buf.length||!cs)return;send('seg',{i:cs.id,c:cs.c,w:cs.w,e:cs.e,p:buf});buf=[]};
cv.onpointerdown=e=>{if(!canDraw()||e.button>0)return;cv.setPointerCapture(e.pointerId);const pt=pos(e);
 cs={id:uid.slice(0,6)+Date.now().toString(36),c:color,w:size,e:erase,p:[pt]};S.set(cs.id,cs);order.push(cs.id);seg(cs,0);buf=[pt];raf||(raf=requestAnimationFrame(flush))};
cv.onpointermove=e=>{if(!cs)return;const n=cs.p.length;for(const v of(e.getCoalescedEvents?e.getCoalescedEvents():[e])){const pt=pos(v);cs.p.push(pt);buf.push(pt)}seg(cs,n);raf||(raf=requestAnimationFrame(flush))};
cv.onpointerup=cv.onpointercancel=()=>{if(!cs)return;flush();mine.push(cs.id);cs=null};
['#1b2330','#6b7280','#c0392b','#e67e22','#f1c40f','#2e9e6a','#0e6b73','#2f6fdb','#6c3fc4','#d6478f','#8a5a3b','#ffffff'].forEach(c=>{const b=document.createElement('button');b.style.background=c;b.dataset.c=c;b.onclick=()=>setColor(c);$('#sw').append(b)});
function setColor(c){color=c;$('#cp').value=c;setTool(false);$$('#sw button').forEach(b=>b.classList.toggle('on',b.dataset.c==c))}
function setTool(x){erase=x;$('#be').classList.toggle('on',x);$('#bp').classList.toggle('on',!x)}
$('#cp').oninput=e=>setColor(e.target.value);$('#sz').oninput=e=>size=+e.target.value;
$('#bp').onclick=()=>setTool(false);$('#be').onclick=()=>setTool(true);
$('#un').onclick=()=>{if(!canDraw())return;const i=mine.pop();if(!i)return;rmS(i);redraw();send('undo',{i})};
$('#cr').onclick=()=>{if(canDraw()){wipe();send('clear')}};
$('#sv').onclick=()=>{const a=document.createElement('a');a.href=cv.toDataURL();a.download='drawing.png';a.click()};
setColor('#1b2330');

/* ---- chat / players / game UI ---- */
function say(name,text,cls){const d=document.createElement('div');if(cls)d.className=cls;if(name){const b=document.createElement('b');b.textContent=name+' ';d.append(b)}d.append(text);const l=$('#log');l.append(d);l.scrollTop=l.scrollHeight}
function ordp(){return[...players].sort((a,b)=>a.t-b.t||(a.id>b.id?1:-1))}
const nm=id=>(players.find(p=>p.id==id)||{}).name||'?';
function rpl(){const box=$('#pl');box.innerHTML='';ordp().forEach(p=>{const d=document.createElement('div');d.className='p';const a=document.createElement('span'),b=document.createElement('small');
 a.textContent=p.name+(p.id==uid?' ('+t('me')+')':'');b.textContent=mode=='game'?(game.ph=='draw'&&game.drawer==p.id?'✎ ':'')+(scores[p.id]||0):'';d.append(a,b);box.append(d)})}
function rui(){if(page!='room')return;const g=mode=='game',m=$('#msg');$('#go').hidden=!g;$('#go').textContent=t(game.ph=='idle'?'start':'skip');m.textContent='';
 if(!g)m.textContent=t('freeMsg');
 else if(game.ph=='draw'){const e=document.createElement('em');
  if(game.drawer==uid){m.append(t('yours'));e.textContent=secret}else{m.append(nm(game.drawer)+' '+t('drawerIs')+'  ');e.textContent='○ '.repeat(game.len).trim()}m.append(e)}
 else m.textContent=t(game.ph=='reveal'?'wait':'idle');
 cv.classList.toggle('lock',!canDraw())}
const doSend=()=>{const v=$('#ci').value.trim();if(!v||!ch)return;$('#ci').value='';
 if(mode=='game'&&game.ph=='draw'&&game.drawer!=uid){if(!game.hits.includes(uid))send('guess',{id:uid,t:v})}
 else{say(me,v);send('chat',{id:uid,t:v})}};
$('#sbtn').onclick=doSend;$('#ci').onkeydown=e=>{if(e.key=='Enter'&&!e.isComposing)doSend()};

/* ---- game (the drawer acts as referee) ---- */
function turn(d,r){game={ph:'draw',drawer:d,len:0,end:Date.now()+80000,hits:[],round:r};wipe();secret='';
 if(d==uid){const w=t('W').split(',');secret=w[Math.random()*w.length|0];game.len=secret.length;send('word',{len:game.len})}
 say('',nm(d)+' '+t('drawerIs'),'sy');rpl();rui()}
function nextTurn(){const ps=ordp();if(ps.length<2)return say('',t('need2'),'sy');
 const k=ps.findIndex(p=>p.id==game.drawer),d=ps[(k+1)%ps.length].id,r=(game.round||0)+1;send('turn',{drawer:d,round:r});turn(d,r)}
function over(w){game.ph='reveal';$('#tm').textContent='';say('',t('over')+w,'sy');rpl();rui();
 if(game.drawer==uid)setTimeout(()=>{if(game.ph=='reveal'&&room)nextTurn()},5000)}
const endTurn=()=>{send('over',{word:secret});over(secret)};
function hit(id,sc){game.hits.push(id);scores=sc;say('',nm(id)+' '+t('hit'),'ok');rpl();if(game.drawer==uid&&game.hits.length>=players.length-1)endTurn()}
$('#go').onclick=nextTurn;
setInterval(()=>{if(mode!='game'||game.ph!='draw')return;const s=Math.ceil((game.end-Date.now())/1000);
 $('#tm').textContent=Math.max(0,s)+'s';if(s<=0&&game.drawer==uid)endTurn()},300);

/* ---- room (private realtime channel) ---- */
async function enter(code,pass){
 wipe();$('#log').innerHTML='';game=newGame();scores={};secret='';synced=false;players=[];
 $('#rc').textContent=code;$('#rpw').textContent=pass||'—';room=code;go('room');setSt('conn');
 try{const{data:{session}}=await sb.auth.getSession();await sb.realtime.setAuth(session.access_token)}catch(e){console.error(e)}
 const c=sb.channel('draw:'+code,{config:{private:true,broadcast:{self:false,ack:false},presence:{key:uid}}});ch=c;
 const on=(e,f)=>c.on('broadcast',{event:e},({payload})=>f(payload));
 on('seg',d=>{let s=S.get(d.i);if(!s){s={c:d.c,w:d.w,e:d.e,p:[]};S.set(d.i,s);order.push(d.i)}const n=s.p.length;s.p.push(...d.p);seg(s,n)});
 on('undo',d=>{rmS(d.i);redraw()});on('clear',wipe);
 on('chat',d=>say(nm(d.id),d.t));
 on('turn',d=>turn(d.drawer,d.round));
 on('word',d=>{game.len=d.len;rui()});
 on('over',d=>over(d.word));
 on('hit',d=>hit(d.id,d.sc));
 on('guess',d=>{if(game.drawer!=uid||game.ph!='draw'||game.hits.includes(d.id))return;
  if(d.t.trim().toLowerCase()==secret.toLowerCase()){scores[d.id]=(scores[d.id]||0)+Math.max(1,Math.ceil((game.end-Date.now())/10000));scores[uid]=(scores[uid]||0)+2;send('hit',{id:d.id,sc:scores});hit(d.id,scores)}
  else{say(nm(d.id),d.t);send('chat',{id:d.id,t:d.t})}});
 on('need',d=>setTimeout(()=>{if(!order.length&&game.ph=='idle')return;let a=order.map(i=>[i,S.get(i)]);while(a.length>1&&JSON.stringify(a).length>180000)a.shift();
  send('sync',{to:d.from,S:a,game:{...game},scores})},Math.random()*250));
 on('sync',d=>{if(d.to!=uid||synced)return;synced=true;S.clear();order.length=0;d.S.forEach(([i,s])=>{S.set(i,s);order.push(i)});redraw();scores=d.scores||{};game=d.game||game;rpl();rui()});
 c.on('presence',{event:'sync'},()=>{players=Object.values(c.presenceState()).map(a=>a[0]);rpl();rui()});
 c.on('presence',{event:'join'},({newPresences})=>{if(Date.now()-t0>1500)newPresences.forEach(p=>p.id!=uid&&say('',p.name+' '+t('joined'),'sy'))});
 c.on('presence',{event:'leave'},({leftPresences})=>leftPresences.forEach(p=>say('',p.name+' '+t('left'),'sy')));
 c.subscribe(async st=>{if(ch!==c)return;
  if(st=='SUBSCRIBED'){t0=Date.now();setSt('live');await c.track({id:uid,name:me,t:Date.now()});send('need',{from:uid})}
  else if(st=='CHANNEL_ERROR'||st=='TIMED_OUT'||st=='CLOSED')setSt('off')});
 clearInterval(hb);hb=setInterval(()=>sb.rpc('touch_room',{p_code:code}).then(()=>{}),60000);
}
async function leave(){clearInterval(hb);const c=ch;ch=null;const code=room;room=null;mode=mode;go('lobby');setSt('live');
 if(c)await sb.removeChannel(c);await rpc('leave_room',{p_code:code})}
$('#lv').onclick=leave;

/* ---- boot ---- */
(async()=>{setSt('conn');applyLang();
 try{let{data:{session}}=await sb.auth.getSession();
  if(!session){const{data,error}=await sb.auth.signInAnonymously();if(error)throw error;session=data.session}
  uid=session.user.id;
  const{data:pf,error}=await sb.from('profiles').select('alias').eq('id',uid).maybeSingle();if(error)throw error;
  setSt('live');if(pf){me=pf.alias;go('mode')}else go('reg')
 }catch(e){console.error(e);setSt('off');go('reg');err('re','errNet')}
})();
</script>
